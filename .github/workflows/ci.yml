name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check, tests, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Unit and component tests, with coverage thresholds
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build the extension
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Manifest V3 extensions only load into a headed browser, so the
      # end-to-end suite runs under a virtual display.
      - name: End-to-end against the built extension
        run: xvfb-run -a npm run e2e:all

      - name: Package for the Chrome Web Store
        run: npm run zip

      - name: Keep the packages as build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: stylegrab-packages
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14
